name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run conformance
      - run: npm run build
      - run: npm run audit:ui:local
      - run: npm run test:sdk-pack
      - run: npm run test:adapter-kit-pack
      - run: npm run verify:rollback
      - run: npm audit --omit=dev
