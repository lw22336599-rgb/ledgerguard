name: Scheduled platform assurance

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

concurrency:
  group: ledgerguard-platform-assurance
  cancel-in-progress: true

jobs:
  deep-production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run monitor:platform
        env:
          LEDGERGUARD_URL: https://ledgerguard-gules.vercel.app
      - run: npm run audit:ui:production
        env:
          LEDGERGUARD_URL: https://ledgerguard-gules.vercel.app
      - run: npm run conformance:extensions
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-platform-assurance
          path: artifacts/ui-audit
          retention-days: 14
