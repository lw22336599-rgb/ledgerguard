name: Independent integration evidence
description: Record a reproducible external LedgerGuard integration without sharing secrets.
title: "[Integration] "
labels:
  - integration-evidence
body:
  - type: markdown
    attributes:
      value: |
        This form verifies real adoption. Use testnet assets only. Never paste API keys, wallet keys, seed phrases, personal data, or real-fund transaction details.

        Quick start: `npm install @ledgerguard1/sdk` — see `docs/DEVELOPER_INTEGRATION_INVITE.md`.
  - type: input
    id: project
    attributes:
      label: Public project or organization
      description: A public repository, product page, or organization name that can be verified.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Integration surface
      options:
        - HTTP API
        - npm package (@ledgerguard1/sdk)
        - TypeScript SDK (monorepo)
        - MCP
        - Guard Link
        - x402 testnet resource
    validations:
      required: true
  - type: input
    id: integration
    attributes:
      label: Non-secret integration identifier
      description: The value sent in X-LedgerGuard-Integration, such as project-name-testnet.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproducible evidence
      description: Include sanitized request IDs, public testnet hashes, or a public code link. Do not include credentials.
    validations:
      required: true
  - type: input
    id: first_use_date
    attributes:
      label: First attributable use date (UTC)
      description: Use YYYY-MM-DD. Project-owner tests and CI do not count.
      placeholder: 2026-08-04
    validations:
      required: true
  - type: input
    id: latest_use_date
    attributes:
      label: Latest attributable use date (UTC)
      description: Optional on the first submission. Use YYYY-MM-DD when updating this issue. Repeat use counts only when this is at least 14 calendar days after the first attributable use.
      placeholder: Not yet, or 2026-08-18
  - type: dropdown
    id: commercial
    attributes:
      label: Commercial next step
      options:
        - Test only
        - Open to a paid pilot
        - Open to a monthly plan
        - Need an enterprise/OEM discussion
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Choosing a commercial next step records interest only. It is not a paid commitment. A commitment counts only when an authorized buyer confirms scope, price, decision date, conditions, and acceptance criteria in writing. Send non-public commercial terms to the project email rather than posting them in this issue.
